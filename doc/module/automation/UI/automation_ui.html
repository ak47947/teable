    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // ===== 1. 节点与面板切换逻辑 =====
            const nodeTrigger = document.getElementById('node-trigger');
            const nodeAction = document.getElementById('node-action');
            const panelTrigger = document.getElementById('panel-trigger');
            const panelAction = document.getElementById('panel-action');

            function switchNode(nodeType) {
                if (nodeType === 'action') {
                    nodeAction.classList.add('border-blue-400', 'shadow-[0_4px_12px_rgba(51,112,255,0.15)]');
                    nodeAction.classList.remove('border-transparent', 'shadow-sm');
                    nodeTrigger.classList.remove('border-blue-400', 'shadow-[0_4px_12px_rgba(51,112,255,0.15)]');
                    nodeTrigger.classList.add('border-transparent', 'shadow-sm');
                    panelAction.classList.remove('hidden');
                    panelAction.classList.add('block');
                    panelTrigger.classList.remove('block');
                    panelTrigger.classList.add('hidden');
                } else {
                    nodeTrigger.classList.add('border-blue-400', 'shadow-[0_4px_12px_rgba(51,112,255,0.15)]');
                    nodeTrigger.classList.remove('border-transparent', 'shadow-sm');
                    nodeAction.classList.remove('border-blue-400', 'shadow-[0_4px_12px_rgba(51,112,255,0.15)]');
                    nodeAction.classList.add('border-transparent', 'shadow-sm');
                    panelTrigger.classList.remove('hidden');
                    panelTrigger.classList.add('block');
                    panelAction.classList.remove('block');
                    panelAction.classList.add('hidden');
                }
            }

            nodeAction.addEventListener('click', () => switchNode('action'));
            nodeTrigger.addEventListener('click', () => switchNode('trigger'));

            // ===== 2. 触发器面板：动态添加条件逻辑 =====
            const addConditionBtn = document.getElementById('add-condition-btn');
            const conditionsContainer = document.getElementById('conditions-container');

            addConditionBtn.addEventListener('click', () => {
                const conditionRowHTML = `
                    <div class="flex items-center space-x-2 group mt-2">
                        <div class="w-1/3 relative"><select class="w-full border border-border rounded px-2 py-1.5 appearance-none text-xs focus:border-brand bg-white"><option>状态</option></select></div>
                        <div class="w-1/4 relative"><select class="w-full border border-border rounded px-2 py-1.5 appearance-none text-xs focus:border-brand bg-white"><option>等于</option></select></div>
                        <div class="flex-1"><input type="text" class="w-full border border-border rounded px-2 py-1.5 text-xs focus:outline-none focus:border-brand" placeholder="请输入"></div>
                        <button class="text-gray-400 hover:text-danger opacity-0 group-hover:opacity-100 transition" onclick="this.parentElement.remove()">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>`;
                conditionsContainer.insertAdjacentHTML('beforeend', conditionRowHTML);
            });

            // ===== 3. 触发器面板：测试运行逻辑 =====
            const testRunBtn = document.getElementById('test-run-btn');
            const tableSelect = document.getElementById('table-select');
            const tableError = document.getElementById('table-error');
            const testResultArea = document.getElementById('test-result-area');

            testRunBtn.addEventListener('click', () => {
                if (!tableSelect.value) {
                    tableSelect.classList.add('border-danger');
                    tableError.classList.remove('hidden');
                    testResultArea.classList.add('hidden');
                } else {
                    tableSelect.classList.remove('border-danger');
                    tableError.classList.add('hidden');
                    testRunBtn.textContent = '运行中...';
                    setTimeout(() => {
                        testRunBtn.textContent = '重新测试';
                        testResultArea.classList.remove('hidden');
                    }, 500);
                }
            });

            tableSelect.addEventListener('change', (e) => {
                if (e.target.value) {
                    tableSelect.classList.remove('border-danger');
                    tableError.classList.add('hidden');
                }
            });
        });
    </script>
</body>

</html>
